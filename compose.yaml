services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: gigaquizz
      POSTGRES_DB: gigaquizz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigaquizz -d gigaquizz"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_data:
